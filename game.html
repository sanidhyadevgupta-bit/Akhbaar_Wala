<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Akhbaar Wala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;800&family=Mukta+Vaani:wght@400;600;800&family=Kalam:wght@700&family=Farsan&family=Shrikhand&display=swap">
<style>
/* Layout: full-bleed dawn street in 3D; HUD as thin bands; menus are newspaper pages laid over the street; screens change with a page-turn wipe */
:root{
  --dawn-top:#6c6fb4;
  --dawn-low:#f4b88c;
  --paper:#f7efdd;
  --paper-2:#efe3c8;
  --card:#fffaf0;
  --ink:#211c2b;
  --ink-soft:#5b5163;
  --rule:#c9b998;
  --saffron:#e8701a;
  --clay:#b5542e;
  --good:#2f8a5f;
  --bad:#c6383f;
  --gold:#ffcf5a;
  --display:"Rozha One","Noto Serif Devanagari",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --hand:"Kalam","Mukta","Noto Sans Devanagari",cursive;
  color-scheme:light;
}
:root[data-lang="gu"]{
  --display:"Shrikhand","Mukta Vaani","Noto Sans Gujarati",serif;
  --body:"Mukta Vaani","Noto Sans Gujarati",system-ui,sans-serif;
  --hand:"Farsan","Mukta Vaani","Noto Sans Gujarati",cursive;
}
html,body{height:100%}
body{background:var(--dawn-low);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--dawn-top) 0%,#c48aa6 38%,var(--dawn-low) 62%);z-index:0;transition:background 1s}
#sky .sun{position:absolute;left:58%;top:44%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff3c9 0%,#ffd27f 45%,rgba(255,190,110,0) 72%);transform:translate(-50%,-50%)}
#sky .stars{position:absolute;inset:0 0 45% 0;opacity:0;transition:opacity 1s;background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 44% 30%,#fff,transparent),radial-gradient(1px 1px at 61% 9%,#fff,transparent),radial-gradient(1.6px 1.6px at 78% 26%,#fff,transparent),radial-gradient(1.2px 1.2px at 90% 14%,#fff,transparent),radial-gradient(1px 1px at 35% 40%,#fff,transparent),radial-gradient(1.3px 1.3px at 85% 42%,#fff,transparent)}
body.night{background:#2a2152}
body.night #sky{background:linear-gradient(180deg,#120f2e 0%,#2a2152 55%,#5a3a6e 80%)}
body.night #sky .sun{width:58px;height:58px;top:26%;left:72%;background:radial-gradient(circle,#fffbe8 0%,#f3eac2 52%,rgba(240,230,190,0) 72%)}
body.night #sky .stars{opacity:.85}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#speedfx{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 58%,rgba(33,28,43,0) 52%,rgba(33,28,43,.55) 100%)}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:var(--bad)}
#flash.on{animation:flash .45s ease-out}
#flash.gold{background:var(--gold)}
@keyframes flash{0%{opacity:.38}100%{opacity:0}}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;transition:transform .45s cubic-bezier(.2,1.2,.4,1),opacity .3s}
#hud.off{transform:translateY(-120%);opacity:0}
.chip{background:rgba(33,28,43,.8);color:var(--paper);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:8px;line-height:1}
.chip .lbl{font-size:12px;letter-spacing:.04em;opacity:.8}
#score{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;min-width:2ch;display:inline-block}
#combo{font-family:var(--hand);color:var(--gold);font-size:17px;display:inline-block}
#papers{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;display:inline-block}
.paper-ico{width:26px;height:18px;flex:none}
.hud-r{display:flex;gap:8px;align-items:center}
#lives{display:flex;gap:4px;align-items:flex-end}
.kulhad{width:14px;height:17px;background:var(--clay);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);border-top:3px solid #e9c9a8;transition:opacity .3s,transform .3s}
.kulhad.lost{opacity:.2;transform:translateY(3px) rotate(8deg)}
.kulhad.breaking{animation:crack .5s ease-out forwards}
@keyframes crack{0%{transform:scale(1)}25%{transform:scale(1.6) rotate(-12deg);background:#fff}55%{transform:scale(1.2) rotate(10deg)}100%{transform:translateY(3px) rotate(8deg);opacity:.2}}
.bump{animation:bump .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.chip.empty{background:rgba(198,56,63,.92);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hbtn{pointer-events:auto;background:rgba(33,28,43,.8);color:var(--paper);border:0;border-radius:10px;font:600 14px var(--body);padding:8px 12px;cursor:pointer;line-height:1}
.hbtn:active{transform:scale(.92)}
button:focus-visible,select:focus-visible,input:focus-visible,#splash:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
#route{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);width:min(280px,62vw);height:8px;margin-left:calc(min(280px,62vw) / -2);background:rgba(33,28,43,.55);border-radius:999px;z-index:5;transition:opacity .3s}
#routeFill{height:100%;width:0;background:var(--gold);border-radius:inherit}
#routeDot{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--paper);border:3px solid var(--saffron)}
#routeFlag{position:absolute;right:-6px;top:-7px;width:4px;height:22px;background:var(--paper)}
#routeFlag::after{content:"";position:absolute;left:4px;top:0;width:12px;height:9px;background:var(--saffron)}

/* Tap zones hint */
#zones{position:fixed;inset:0;z-index:3;display:grid;grid-template-columns:34fr 32fr 34fr;pointer-events:none;transition:opacity .9s;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
#zones > div{display:flex;align-items:flex-end;justify-content:center;font-family:var(--hand);font-size:clamp(15px,4vw,20px);color:#fff;text-shadow:0 2px 6px rgba(33,28,43,.7);text-align:center;padding-inline:6px}
#zones > div:nth-child(2){border-left:2px dashed rgba(255,255,255,.55);border-right:2px dashed rgba(255,255,255,.55)}
#zones.fade{opacity:0}

/* floating feedback */
#floats{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--hand);font-size:clamp(22px,6vw,30px);color:#fff6d8;white-space:nowrap;text-shadow:0 2px 0 rgba(33,28,43,.6),0 0 12px rgba(33,28,43,.35);animation:floatUp .95s ease-out forwards}
.float.gold{color:var(--gold);font-size:clamp(28px,7.5vw,38px)}
.float.bad{color:#ffd0d0}
.float.dim{color:#e9e2ee;font-size:20px}
@keyframes floatUp{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}18%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
#toasts{position:fixed;left:0;right:0;top:22%;z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{font-family:var(--hand);font-size:clamp(20px,5.6vw,30px);color:#fff;text-shadow:0 2px 0 rgba(33,28,43,.55),0 0 14px rgba(33,28,43,.35);animation:pop 1.15s ease-out forwards;text-align:center}
.toast.big{font-family:var(--display);font-size:clamp(34px,10vw,56px);color:var(--gold);text-shadow:0 4px 0 var(--clay),0 10px 24px rgba(33,28,43,.35)}
.toast.task{font-family:var(--body);font-weight:800;font-size:clamp(15px,4vw,19px);background:var(--paper);color:var(--ink);text-shadow:none;padding:8px 14px;border-left:5px solid var(--good);box-shadow:0 8px 20px rgba(33,28,43,.3);animation:slideTask 2.2s cubic-bezier(.2,1.2,.4,1) forwards}
.toast.task small{display:block;font-weight:600;color:var(--ink-soft);font-size:.82em}
.toast.bad{color:#ffd9d9}
@keyframes pop{0%{transform:translateY(10px) scale(.7);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
@keyframes slideTask{0%{transform:translateY(-30px) scale(.9);opacity:0}12%{transform:none;opacity:1}85%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
#count{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none}
#count span{font-family:var(--display);font-size:clamp(110px,32vw,220px);line-height:1;color:var(--paper);text-shadow:0 6px 0 var(--clay),0 16px 34px rgba(33,28,43,.4);animation:countPop .62s ease-out both}
#count span.go{color:var(--gold);font-size:clamp(80px,22vw,160px)}
@keyframes countPop{0%{transform:scale(2.3) rotate(-6deg);opacity:0}25%{transform:scale(1) rotate(0);opacity:1}80%{opacity:1}100%{transform:scale(.75);opacity:0}}

/* Ticker */
#ticker{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:3px double var(--ink);display:flex;align-items:center;gap:10px;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
#ticker.off{transform:translateY(110%)}
#ticker .tag{background:var(--saffron);color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:3px 8px;border-radius:3px;flex:none}
#tickerText{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:opacity .25s,transform .25s}
#tickerText.swap{opacity:0;transform:translateY(8px)}

/* Splash */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;text-align:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 7vh);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(33,28,43,.18) 0%,rgba(33,28,43,0) 35%,rgba(33,28,43,0) 60%,rgba(33,28,43,.4) 100%)}
.splash-head{display:flex;flex-direction:column;align-items:center;gap:10px}
.edition{background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.03em;padding:4px 12px;border:1.5px solid var(--ink);animation:rise .5s .1s both}
.splash-title{font-family:var(--display);font-weight:400;font-size:clamp(60px,18vw,140px);line-height:1;margin:0;color:var(--paper);text-shadow:0 5px 0 var(--clay),0 12px 30px rgba(33,28,43,.45);transform:rotate(-2deg);animation:stamp .75s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:scale(2.6) rotate(-9deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.splash-tag{margin:0;font-family:var(--hand);font-size:clamp(17px,4.6vw,24px);color:#fff;text-shadow:0 2px 6px rgba(33,28,43,.6);animation:rise .5s .7s both;max-width:32ch}
.splash-foot{display:flex;flex-direction:column;align-items:center;gap:14px;animation:rise .5s .9s both}
.splash-foot .seg{background:var(--paper)}
.tap{font:800 19px var(--body);background:var(--saffron);color:#fff;border:0;padding:14px 26px;border-radius:999px;box-shadow:0 5px 0 var(--clay);cursor:pointer;animation:breathe 1.5s 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

/* Newspaper sheets */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;background:rgba(33,28,43,.3);animation:dim .35s ease both;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
@keyframes dim{from{background:rgba(33,28,43,0)}}
.sheet.side{place-items:end center;background:linear-gradient(180deg,rgba(33,28,43,0) 30%,rgba(33,28,43,.32) 100%)}
@media (min-width:900px){.sheet.side{place-items:center start;padding-left:max(6vw,16px)}}
#reward{z-index:30;background:rgba(33,28,43,.5)}
.page{background:var(--paper);width:min(540px,100%);padding:16px 20px 20px;box-shadow:0 22px 50px rgba(33,28,43,.4),0 2px 0 var(--paper-2);transform:rotate(-.7deg);display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(0deg,rgba(33,28,43,.025) 0 1px,transparent 1px 4px)}
.page.enter{animation:drop .55s cubic-bezier(.2,1.3,.4,1) both}
.page.enter > *{animation:rise .42s both;animation-delay:calc(.12s + var(--i,0) * 40ms)}
.page.leave{animation:leave .38s cubic-bezier(.6,0,.8,.4) both}
@keyframes drop{0%{transform:translateY(60px) rotate(-6deg) scale(.9);opacity:0}100%{transform:rotate(-.7deg);opacity:1}}
@keyframes leave{to{transform:translateY(120%) rotate(8deg);opacity:0}}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12px;letter-spacing:.03em;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px}
.mast{font-family:var(--display);font-weight:400;font-size:clamp(42px,11vw,70px);line-height:1;text-align:center;margin:0}
.mast-sub{text-align:center;font-size:14px;color:var(--ink-soft);border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:5px 0;margin:0}
.kicker{font-weight:800;color:var(--saffron);font-size:13px;letter-spacing:.06em;margin:0}
.headline{font-family:var(--display);font-weight:400;font-size:clamp(24px,6.2vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:0;font-size:16px;line-height:1.55;max-width:62ch}
.cols{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.cols > div{padding:10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cols > div + div{border-left:1px solid var(--rule)}
.cols .k{font-family:var(--display);font-size:22px;line-height:1.1}
.cols .v{font-size:13px;line-height:1.35;color:var(--ink-soft)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45}
.keys{font-size:12px;color:var(--ink-soft);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:600 16px var(--body);padding:8px 10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;max-width:100%}
.btn{font:800 17px var(--body);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;background:var(--ink);color:var(--paper);transition:transform .12s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.primary{background:var(--saffron);color:#fff;box-shadow:0 4px 0 var(--clay)}
.btn.primary:active{box-shadow:0 1px 0 var(--clay)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.wide{width:100%}
.btn.grow{flex:1 1 140px}
.btn small{display:block;font-size:12.5px;font-weight:600;opacity:.88;letter-spacing:.02em;margin-top:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.play{padding:12px 18px 11px;font-size:24px;line-height:1.1;text-align:center}
@media (hover:hover){.btn:not(:disabled):hover{transform:translateY(-2px)}.btn.primary:not(:disabled):hover{box-shadow:0 6px 0 var(--clay)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats > div{padding:10px 6px;text-align:center;min-width:0}
.stats > div + div{border-left:1px solid var(--rule)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-soft)}
.stamp{align-self:flex-start;font-family:var(--display);font-size:18px;color:var(--bad);border:2.5px solid var(--bad);padding:2px 10px;transform:rotate(-6deg);margin:0}
.page.enter .stamp{animation:stampSmall .6s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampSmall{0%{transform:scale(3) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
#shareBox{width:100%;font:14px var(--body);padding:8px;border:1px solid var(--ink);background:var(--card);resize:none}
.note{font-size:13px;color:var(--ink-soft);margin:0;min-height:1.2em}

/* menu parts */
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.pill{display:flex;align-items:baseline;gap:6px;border:1.5px solid var(--ink);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card)}
.pill b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.pill.streak b{color:var(--clay)}
.daily{border:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.daily-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.daily-head .kicker{font-size:14px}
.next{font-size:12px;color:var(--ink-soft)}
.next b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:14px;line-height:1.3}
.task .box{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px;display:grid;place-items:center;color:#fff}
.task .box svg{width:12px;height:12px;opacity:0}
.task.done .box{background:var(--good);border-color:var(--good)}
.task.done .box svg{opacity:1}
.task.done .txt{color:var(--ink-soft);text-decoration:line-through}
.task .meta{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.task .meta b{color:var(--clay)}
.alldone{margin:0;font-size:13px;color:var(--good);font-weight:600}
.daily-play{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.daily-play .btn{flex:1 1 200px}
.mini-best{display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--ink-soft);flex:0 1 auto}
.mini-best b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);line-height:1.1}
.menu-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu-actions .btn{padding:10px 6px;font-size:15px}

/* settings */
.set-list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.set-row .lab{font-weight:600;font-size:15px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 15px var(--body);background:transparent;border:0;padding:7px 12px;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[lang="gu"]{font-family:"Mukta Vaani","Noto Sans Gujarati",sans-serif}
.seg button[lang="hi"]{font-family:"Mukta","Noto Sans Devanagari",sans-serif}
.switch{font:600 14px var(--body);display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;color:var(--ink);padding:4px 0}
.switch .trk{width:42px;height:24px;border-radius:999px;background:#cfc3a8;position:relative;transition:background .2s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,1.4,.4,1);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-pressed="true"] .trk{background:var(--good)}
.switch[aria-pressed="true"] .trk::after{transform:translateX(18px)}
.range{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
input[type=range]{accent-color:var(--saffron);width:min(170px,44vw)}
.confirm{border:1.5px solid var(--bad);padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{border:1.5px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card);min-width:0}
.item.on{box-shadow:inset 0 0 0 2px var(--good);border-color:var(--good)}
.item-top{display:flex;align-items:center;gap:10px;min-width:0}
.sw{width:40px;height:30px;flex:none;display:grid;place-items:center}
.sw svg{width:40px;height:30px}
.item .nm{font-weight:600;font-size:14px;line-height:1.2;min-width:0}
.item .sub{font-size:11px;color:var(--ink-soft);display:block;font-weight:400}
.item .btn{padding:7px 8px;font-size:14px;width:100%}
.item.pulse{animation:bump .45s}

/* reward */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d{border:1.5px solid var(--rule);padding:6px 2px;text-align:center;font-size:10.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--card)}
.d b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink);line-height:1.1}
.d.past{background:#e3f1e8;border-color:var(--good)}
.d.today{border:2px solid var(--saffron);background:#fff1dd;animation:breathe 1.4s infinite}
.reward-amt{font-family:var(--display);font-size:clamp(52px,15vw,78px);line-height:1;color:var(--clay);text-align:center;margin:0}
.coin{position:fixed;z-index:60;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f4b81c 55%,#b8860b);color:#7a5200;font:800 14px var(--body);display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.25)}

/* Page-turn wipe */
#wipe{position:fixed;top:-4vh;bottom:-4vh;left:-6vw;right:-6vw;z-index:50;display:grid;place-items:center;align-content:center;gap:6px;background-color:var(--paper);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(33,28,43,.14) calc(20% - 1px) 20%),repeating-linear-gradient(0deg,rgba(33,28,43,.05) 0 2px,transparent 2px 14px);
  box-shadow:-40px 0 60px rgba(33,28,43,.35),40px 0 60px rgba(33,28,43,.35);pointer-events:all}
#wipe .wm{font-family:var(--display);font-size:clamp(46px,13vw,104px);line-height:1.1;color:var(--ink);border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 18px;background:var(--paper)}
#wipe .ws{font-family:var(--hand);font-size:18px;color:var(--clay);background:var(--paper);padding:0 10px}
#wipe.in{animation:wipeIn .4s cubic-bezier(.7,0,.3,1) both}
#wipe.out{animation:wipeOut .42s cubic-bezier(.7,0,.3,1) both}
@keyframes wipeIn{from{transform:translateX(110%) rotate(5deg)}to{transform:translateX(0) rotate(0)}}
@keyframes wipeOut{from{transform:translateX(0) rotate(0)}to{transform:translateX(-110%) rotate(-5deg)}}

#wm{position:fixed;z-index:45;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 48px);pointer-events:none;
  font:600 11px/1.2 "Mukta",system-ui,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.78);text-shadow:0 1px 3px rgba(33,28,43,.75);text-align:right}
#wm b{font-weight:800}
.credit{margin:0;font:600 13px/1.3 "Mukta",system-ui,sans-serif;color:#fff;text-shadow:0 1px 4px rgba(33,28,43,.7);letter-spacing:.02em}
@media (max-width:420px){
  .cols{grid-template-columns:1fr}
  .cols > div + div{border-left:0;border-top:1px solid var(--rule)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats > div:nth-child(3){border-left:0}
  .stats > div:nth-child(n+3){border-top:1px solid var(--rule)}
  .stats.three{grid-template-columns:repeat(3,1fr)}
  .stats.three > div:nth-child(3){border-left:1px solid var(--rule);border-top:0}
  .page{padding:12px 14px 16px;gap:10px}
  .d{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){
  .page,.page.enter,.page.enter > *,.splash-title,.edition,.splash-tag,.splash-foot,.tap,.d.today{animation:none!important;transform:none}
  #wipe.in{animation:fadeIn .25s both}#wipe.out{animation:fadeIn .25s reverse both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
}
</style>
</head>

const PM = {};

let pIdx = 0;
function emit(x, y, z, n, o){
  for(let k = 0; k < n; k++){
    const p = parts[pIdx++ % parts.length];
    p.m.material = PM[Array.isArray(o.mat) ? pick(o.mat) : o.mat];
    p.m.visible = true;
    const j = o.jitter == null ? .3 : o.jitter;
    p.m.position.set(x + (rnd() - .5) * j, y + (rnd() - .5) * j * .5, z + (rnd() - .5) * j);
    const a = rnd() * Math.PI * 2, sp = (o.speed || 4) * (.4 + rnd() * .6);
    p.v.set(Math.cos(a) * sp, (o.up == null ? 4 : o.up) * (.5 + rnd() * .7), Math.sin(a) * sp + (o.vz || 0));
    p.spin.set(rnd() * 12, rnd() * 12, rnd() * 12);
    p.life = p.max = (o.life || .8) * (.7 + rnd() * .5);
    p.size = (o.size || .18) * (.7 + rnd() * .6);
    p.grav = o.grav == null ? 10 : o.grav;
    p.drag = o.drag || 0; p.face = !!o.face;
    p.m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
  }
}
function updateParts(dt){
  for(const p of parts){
    if(p.life <= 0) continue;
    p.life -= dt;
    if(p.life <= 0){ p.m.visible = false; continue; }
    p.v.y -= p.grav * dt;
    if(p.drag) p.v.multiplyScalar(Math.max(0, 1 - p.drag * dt));
    p.m.position.addScaledVector(p.v, dt);
    if(p.m.position.y < .04){ p.m.position.y = .04; p.v.multiplyScalar(.5); p.v.y = 0; }
    if(p.face) p.m.quaternion.copy(camera.quaternion);
    else { p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt; p.m.rotation.z += p.spin.z * dt; }
    const k = p.life / p.max;
    const s = p.size * (p.face ? (1.7 - k * .7) * Math.min(1, k * 3) : Math.min(1, k * 2.5));
    p.m.scale.set(s * (p.face ? 1 : 1.4), s, s);
  }
}

  for(let i = 0; i < 4; i++) box(.7, .12, .5, i % 2 ? 0xf4ecd8 : 0xe9dfc6, 0, i * .13 - .2, 0, b);
  box(.08, .62, .54, 0xc6383f, 0, 0, 0, b);
  return b;
}
function makeFinish(g, z){
  [-1, 1].forEach(s => { cyl(.12, 5, 0xf7efdd, s * 3.6, 2.5, z, g); sph(.2, glowMat, s * 3.6, 5.1, z, g); });
  if(bannerMat){ const b = new THREE.Mesh(GEO.plane, bannerMat); b.scale.set(7.2, 1.35, 1); b.position.set(0, 4.3, z); g.add(b); }
  for(let k = 0; k < 12; k++) box(.5, .02, .5, k % 2 ? 0x211c2b : 0xf7efdd, -2.75 + k * .5, .015, z, g);
}
function makeChunk(i){
  const z0 = -i * CH;
  const g = new THREE.Group(); scene.add(g);
  const ch = {i, z: z0, g, targets: [], wrong: [], obstacles: [], bundles: []};
  const daily = S.run === 'daily';
  const past = daily && i >= ROUTE_CHUNKS;
  box(.16, .02, 2.4, 0xf1e6c8, 0, .012, z0 - 2.5, g);
  box(.16, .02, 2.4, 0xf1e6c8, 0, .012, z0 - 7.5, g);
  [-1, 1].forEach(s => {
    box(.25, .22, 5, 0x24212a, s * 3.1, .11, z0 - 2.5, g);
    box(.25, .22, 5, 0xf0d24a, s * 3.1, .11, z0 - 7.5, g);
  });
  if(((i % 3) + 3) % 3 === 0){ cyl(.1, 6, 0x8a8f96, -3.8, 3, z0 - 5, g); box(1.2, .08, .08, 0x8a8f96, -3.5, 5.8, z0 - 5, g); if(isNight()) sph(.18, winGlow, -3.0, 5.7, z0 - 5, g); }
  if(daily && i === ROUTE_CHUNKS) makeFinish(g, z0);
  let leftSub = false;
  [-1, 1].forEach(side => {
    const zc = z0 - CH/2;
    const r = wr();
    let pSub = past ? 0 : (i >= 2 ? .42 : .2);
    if(side === 1 && leftSub) pSub *= .45;
    if(r < pSub){ makeHouse(ch, side, zc, true); if(side === -1) leftSub = true; }
    else if(r < pSub + .33) makeHouse(ch, side, zc, false);
    else if(r < pSub + .43) makeChai(ch, side, zc);
    else makeTree(ch, side, zc);
  });
  const hazards = daily ? !past : S.mode === 'play';
  if(hazards && i >= 4){
    const p = Math.min(.5, .2 + i * .004);
    const a = wr(), zr = wr(), tr = wr(), br = wr();
    if(a < p){
      const z = z0 - 2 - zr * 6;
      const type = tr < .5 ? 'dog' : 'hole';
      const mesh = type === 'dog' ? makeDog(g, z) : makePothole(g, z);
      ch.obstacles.push({z, type, mesh, hit:false, cleared:false});
    } else {
      const pb = daily ? .16 : (S.papers < 6 ? .4 : .11);
      if(br < pb){ const z = z0 - 5; ch.bundles.push({z, mesh: makeBundle(g, z), taken:false}); }
    }

}
function ensureChunks(){
  while(-nextChunk * CH > S.pz - 130) chunks.push(makeChunk(nextChunk++));
  const keep = S.mode === 'splash' ? 60 : 18;
  while(chunks.length && chunks[0].z - CH > S.pz + keep){ scene.remove(chunks.shift().g); }
  while(landed.length && landed[0].z > S.pz + keep){ scene.remove(landed.shift().m); }
}
function resetWorld(){
  chunks.forEach(c => scene.remove(c.g)); chunks = []; nextChunk = -6;
  flying.forEach(f => scene.remove(f.m)); flying = [];
  landed.forEach(f => scene.remove(f.m)); landed = [];
  parts.forEach(p => { p.life = 0; p.m.visible = false; });
  S.pz = 0; ensureChunks();
}

/* ---------- state ---------- */
const S = {mode:'splash', run:'endless', paused:false, pz:0, speed:6, t:0, score:0, shownScore:0, papers:15, lives:3, combo:0, bestCombo:0, delivered:0, perfects:0, bundles:0, hops:0, earned:0, finished:false,
  jumpY:0, jumpV:0, inv:0, shake:0, pedal:0, throwT:0, throwSide:1, lean:0, squash:0, wobble:0, fovKick:0, hitstop:0, slow:1, dustT:0, headline:0, time:0};
const GRAV = 22, VY = 5;

/* ---------- HUD ---------- */
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function buildLives(){ const el = $('lives'); el.innerHTML = ''; for(let k = 0; k < 3; k++){ const s = document.createElement('span'); s.className = 'kulhad' + (k >= S.lives ? ' lost' : ''); el.appendChild(s); } }
function comboMult(){ return Math.min(3, 1 + Math.floor(S.combo / 4)); }
function hudPapers(){ $('papers').textContent = S.papers; $('papersChip').classList.toggle('empty', S.papers === 0); }
function hudCombo(){ const m = comboMult(); $('combo').textContent = m > 1 ? T('comboL', {m}) : ''; }
function toast(html, cls, ms){

  while(layer.children.length > 2) layer.removeChild(layer.firstChild);
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.innerHTML = html;
  layer.appendChild(t); setTimeout(() => t.remove(), ms || 1200);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function flash(gold){ const f = $('flash'); f.className = ''; void f.offsetWidth; f.className = 'on' + (gold ? ' gold' : ''); }
function nextHeadline(){
  const el = $('tickerText'); el.classList.add('swap');

}
function shakeAmt(v){ return prefs.shake ? v : 0; }

/* ---------- daily goals ---------- */
function goalLive(g){
  switch(g.t){
    case 'deliver': return S.delivered; case 'combo': return S.bestCombo; case 'perfect': return S.perfects;
    case 'bundles': return S.bundles; case 'hops': return S.hops; case 'score': return S.score;
    case 'route': return save.day.routeDone ? 1 : 0; case 'total': return save.day.total + S.delivered;
  }
  return 0;
}
function goalProgress(g, live){
  const stored = g.t === 'total' ? save.day.total : g.t === 'route' ? (save.day.routeDone ? 1 : 0) : (save.day.max[g.t] || 0);
  return Math.min(g.n, Math.max(stored, live ? goalLive(g) : 0));
}
function checkGoals(){
  if(!save.day || S.mode !== 'play' && !S.finished) return;
  save.day.goals.forEach((g, i) => {
    if(save.day.done[i]) return;
    if(goalLive(g) >= g.n){
      save.day.done[i] = true; save.tips += g.r;
      toast(esc(T('task', {r:g.r})) + '<small>' + esc(T('goals.' + g.t, {n:g.n})) + '</small>', 'task', 2300);
      sfx.task(); buzz(25);
      if(save.day.done.every(Boolean) && !save.day.allBonus){
        save.day.allBonus = true; save.tips += ALL_BONUS;
        setTimeout(() => { toast(esc(T('allTasks', {r:ALL_BONUS})), 'big', 1600); sfx.combo(); }, 900);
      }
      persist();
    }
  });
}

/* ---------- actions ---------- */
function flightTime(y0){ return (VY + Math.sqrt(VY * VY + 2 * GRAV * (y0 - .15))) / GRAV; }
function throwPaper(side, auto){
  if(!auto){
    if(S.mode !== 'play' || S.paused) return;
    if(S.papers <= 0){ toast(esc(T('empty')), 'bad'); sfx.miss(); const c = $('papersChip'); c.classList.remove('empty'); void c.offsetWidth; c.classList.add('empty'); buzz(30); return; }
    S.papers--; hudPapers(); bump($('papers'));
  }
  const y0 = 1.6 + S.jumpY, T0 = flightTime(y0);
  let vz = -S.speed;
  const landZ = S.pz + vz * T0;
  let best = null, bd = 4;
  chunks.forEach(c => c.targets.forEach(tg => {
    if(tg.side !== side || tg.done || tg.missed) return;
    const d = Math.abs(tg.z - landZ); if(d < bd){ bd = d; best = tg; }
  }));
  const assist = auto ? 1 : (prefs.assist ? .6 : 0);
  if(best) vz += ((best.z - landZ) * assist) / T0;
  const m = new THREE.Mesh(GEO.paper, paperMat);
  m.position.set(side * .4, y0, S.pz); scene.add(m);
  flying.push({m, p: new THREE.Vector3(side * .4, y0, S.pz), v: new THREE.Vector3(side * 6.0 / T0, VY, vz), side, spin: 8 + rnd() * 6, auto: !!auto, trail:0});
  S.throwT = .35; S.throwSide = side; S.lean = side * .22;
  if(!auto){ sfx.throw(); buzz(8); }
}
function jump(){
  if(S.mode !== 'play' || S.paused) return;
  if(S.jumpY === 0 && S.jumpV === 0){
    S.jumpV = 8.2; sfx.jump(); S.squash = -.18;
    emit(0, .1, S.pz + .6, 8, {mat:'dust', speed:2, up:1.2, life:.5, size:.35, grav:0, drag:3, face:true});
  }
}
function land(f){
  f.p.y = .14; f.m.position.copy(f.p); f.m.rotation.set(0, rnd() * Math.PI, Math.PI/2);
  landed.push({m: f.m, z: f.p.z});
  let hit = null, hd = 1.65;
  chunks.forEach(c => c.targets.forEach(tg => {
    if(tg.side !== f.side || tg.done || tg.missed) return;
    const d = Math.hypot(f.p.x - tg.x, f.p.z - tg.z); if(d < hd){ hd = d; hit = tg; }
  }));
  if(hit){
    hit.done = true; hit.ring.material = doneMat; hit.dot.material = doneMat; hit.ring.scale.setScalar(.75);
    hit.doorOpen = 0;
    emit(hit.x, .3, hit.z, 14, {mat:['paper','saffron','green'], speed:4, up:6, life:.9, size:.16, grav:12});
    ringBurst(hit.x, hit.z, 0x52d18a);
    if(S.mode !== 'play') return;
    const prevMult = comboMult();
    S.delivered++; S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo);
    const perfect = hd < .55, mult = comboMult(), pts = (perfect ? 25 : 10) * mult;
    S.score += pts;
    if(perfect){
      S.perfects++;
      emit(hit.x, .4, hit.z, 16, {mat:['gold','white'], speed:5, up:7, life:.7, size:.12, grav:6});
      ringBurst(hit.x, hit.z, 0xffd45a);
      S.hitstop = .07; S.fovKick = prefs.shake ? 5 : 2; flash(true);
      floatText('+' + pts, hit.x, 1.6, hit.z, 'gold');
      toast(esc(T('perfect')), '');
      sfx.perfect(S.combo); buzz(20);
    } else {
      floatText('+' + pts, hit.x, 1.6, hit.z, '');
      if(rnd() < .4) setTimeout(() => floatText(pick(TX.thanks), hit.x, 2.6, hit.z, 'dim'), 180);
      sfx.hit(S.combo); buzz(10);
    }
    if(mult > prevMult){ setTimeout(() => { toast(esc(T('combo', {m:mult})), 'big'); sfx.combo(); }, 120); bump($('combo')); }
    hudCombo(); nextHeadline(); checkGoals(); return;
  }
  emit(f.p.x, .15, f.p.z, 6, {mat:'dust', speed:1.5, up:.8, life:.5, size:.3, grav:0, drag:3, face:true});
  if(S.mode !== 'play') return;
  let wrong = false;
  chunks.forEach(c => c.wrong.forEach(w => { if(w.side === f.side && Math.hypot(f.p.x - w.x, f.p.z - w.z) < 2.4) wrong = true; }));
  const hadCombo = S.combo >= 4;
  S.combo = 0; hudCombo();
  if(wrong){
    S.score = Math.max(0, S.score - 5);
    emit(f.p.x, .3, f.p.z, 8, {mat:'red', speed:3, up:4, life:.6, size:.12, grav:10});
    floatText('−5', f.p.x, 1.4, f.p.z, 'bad');
    toast(esc(T('wrong', {name: pick(TX.names)})), 'bad');
    sfx.wrong();
  } else { floatText(T('miss'), f.p.x, 1.2, f.p.z, 'dim'); sfx.miss(); }
  if(hadCombo) toast(esc(T('broken')), 'bad');
}
function loseLife(msg){
  if(S.mode !== 'play') return;
  S.lives--; S.combo = 0; hudCombo();
  S.shake = shakeAmt(.45); S.hitstop = .12; S.wobble = 1; flash(false); buzz([60, 40, 60]);
  sfx.hurt(); toast(esc(msg), 'bad');
  const k = $('lives').children[S.lives]; if(k) k.classList.add('breaking');
  if(S.lives <= 0){ S.mode = 'over'; S.slow = 1; setMusicMode('over'); sfx.over(); setTimeout(showOver, 1100); }
}
function finishRoute(){
  S.finished = true; S.score += ROUTE_BONUS;
  save.day.routeDone = true; persist();
  checkGoals();
  S.mode = 'over'; S.slow = 1; setMusicMode('over');
  for(let k = 0; k < 4; k++) setTimeout(() => emit((rnd() - .5) * 5, 3 + rnd() * 2, S.pz - 3 - rnd() * 4, 30, {mat:['paper','saffron','gold','pink','green'], speed:6, up:6, life:1.4, size:.18, grav:6}), k * 180);
  toast(esc(T('finish')), 'big', 1600);
  setTimeout(() => floatText(T('bonus', {n:ROUTE_BONUS}), 0, 3, S.pz - 2, 'gold'), 400);
  sfx.finish(); buzz([30, 30, 30, 30, 80]);

/* ---------- camera rigs (relative to rider) ---------- */
const camPos = new THREE.Vector3(0, 2.5, -7.8), camLook = new THREE.Vector3(0, 1.4, 0);
const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
function camTarget(){
  const a = camera.aspect;
  if(S.mode === 'splash'){ tPos.set(0, 2.5, -7.8); tLook.set(0, 1.4, 0); }
  else if(S.mode === 'menu'){ tPos.set(4.0, 2.3, -1.2); if(a >= 1.25) tLook.set(0, 1.0, 2.4); else tLook.set(0, -1.6, .4); }
  else { tPos.set(0, 6.6, 8.6); tLook.set(0, .6, -10); }
}

/* ---------- loop ---------- */
function update(dt, real){
  S.time += dt;
  if(S.mode === 'play'){ S.t += dt; S.speed = Math.min(18, 9 + S.t * .11); }
  else if(S.mode === 'over'){ S.speed = Math.max(0, S.speed - 14 * dt); }
  else if(S.mode === 'countdown'){ S.speed += (8 - S.speed) * Math.min(1, dt * 2); }
  else S.speed = 6;
  S.pz -= S.speed * dt;

  if(S.jumpY > 0 || S.jumpV > 0){
    S.jumpV -= 26 * dt; S.jumpY += S.jumpV * dt;
    if(S.jumpY <= 0){ S.jumpY = 0; S.jumpV = 0; S.squash = .28; sfx.land(); emit(0, .1, S.pz + .5, 10, {mat:'dust', speed:2.5, up:1, life:.5, size:.35, grav:0, drag:3, face:true}); }
  }
  player.position.set(0, 0, S.pz);
  S.squash += (0 - S.squash) * Math.min(1, dt * 10);
  S.lean += (0 - S.lean) * Math.min(1, dt * 5);
  S.wobble = Math.max(0, S.wobble - dt * 1.6);
  rider.position.y = S.jumpY + Math.abs(Math.sin(S.pedal)) * .03;
  rider.scale.set(1 + S.squash * .5, 1 - S.squash, 1 + S.squash * .5);
  rider.rotation.z = S.lean + Math.sin(S.time * 30) * S.wobble * .25;
  rider.rotation.x = S.jumpV > 0 ? -.08 : S.jumpY > 0 ? .06 : 0;
  shadow.scale.set(1.3 - S.jumpY * .2, 2.8 - S.jumpY * .4, 1);
  S.pedal += dt * S.speed * 1.5;
  wheels.forEach(w => { w.rotation.z -= dt * S.speed / .42; });
  crank.rotation.x = Math.PI/2 - S.pedal;
  legs.forEach(l => solveLeg(l, S.pedal + l.phase));
  arms[0].rotation.set(ARM_REST, 0, 0);
  S.throwT = Math.max(0, S.throwT - dt);
  const swing = S.throwT > 0 ? Math.sin((S.throwT / .35) * Math.PI) : 0;
  arms[1].rotation.x = ARM_REST - swing * 2.1;
  arms[1].rotation.z = swing * S.throwSide * 1.1;
  head.rotation.y = -swing * S.throwSide * .5;
  rider.visible = !(S.inv > 0 && Math.floor(S.time * 14) % 2 === 0);
  S.inv = Math.max(0, S.inv - dt);

  S.dustT -= dt;
  if(S.speed > 11.5 && S.jumpY === 0 && S.dustT <= 0){ S.dustT = .09; emit((rnd() - .5) * .3, .1, S.pz + .8, 1, {mat:'dust', speed:.6, up:.4, life:.45, size:.22, grav:0, drag:2, face:true, vz:2}); }

  for(let k = flying.length - 1; k >= 0; k--){
    const f = flying[k];
    f.v.y -= GRAV * dt; f.p.addScaledVector(f.v, dt);
    f.m.position.copy(f.p); f.m.rotation.x += f.spin * dt; f.m.rotation.z = Math.PI/2;
    f.trail -= dt;
    if(f.trail <= 0){ f.trail = .03; emit(f.p.x, f.p.y, f.p.z, 1, {mat:'paper', speed:.2, up:0, life:.25, size:.1, grav:0, jitter:.05}); }
    if(f.p.y <= .15){ flying.splice(k, 1); land(f); }
  }

  ringMat.opacity = .6 + .3 * Math.sin(S.time * 5);
  const TT = flightTime(1.6);
  const attract = S.mode === 'splash' || S.mode === 'menu';
  chunks.forEach(c => {
    c.targets.forEach(tg => {
      if(tg.doorOpen != null && tg.doorOpen < 1){ tg.doorOpen = Math.min(1, tg.doorOpen + dt * 3); tg.door.scale.z = 1.3 * (1 - tg.doorOpen * .85); }
      if(attract && !tg.done && !tg.auto && tg.z >= S.pz - S.speed * TT - .2 && tg.z < S.pz){ tg.auto = true; throwPaper(tg.side, true); }
      if(S.mode === 'play' && !tg.done && !tg.missed && tg.z > S.pz + 4){
        tg.missed = true; tg.ring.material = missMat; tg.dot.material = missMat;
        loseLife(T('missed', {name: tg.name}));
      }
    });
    if(S.mode === 'play'){
      c.obstacles.forEach(ob => {
        if(ob.hit || ob.cleared || Math.abs(ob.z - S.pz) >= .75) return;
        if(S.jumpY >= .45){
          ob.cleared = true; S.score += 5; S.hops++;
          floatText(T('hop'), 0, 2.8, S.pz - 1, '');
          emit(0, .3, ob.z, 6, {mat:'gold', speed:2, up:3, life:.5, size:.1, grav:6});
          checkGoals();
        } else {
          ob.hit = true;
          emit(0, .3, ob.z, 14, {mat:'dust', speed:3, up:2, life:.6, size:.4, grav:0, drag:3, face:true});
          if(ob.type === 'dog'){ ob.mesh.position.x = 2.2; sfx.bark(); } else sfx.thud();
          if(S.inv <= 0){ S.inv = 1.2; loseLife(T(ob.type === 'dog' ? 'dog' : 'hole')); }
        }
      });
      c.bundles.forEach(b => {
        if(b.taken) return;
        b.mesh.rotation.y += dt * 2; b.mesh.position.y = .9 + Math.sin(S.time * 4) * .12;
        if(Math.abs(b.z - S.pz) < 1.1){
          b.taken = true; b.mesh.visible = false; S.bundles++;
          emit(0, 1, b.z, 14, {mat:['gold','paper'], speed:3, up:4, life:.6, size:.12, grav:6});
          S.papers = Math.min(30, S.papers + 10); sfx.pickup(); buzz(15);
          floatText(T('bundle'), 0, 2.6, S.pz - 1, 'gold'); hudPapers(); bump($('papers'));
          checkGoals();
        }
      });
    }
  });
  if(S.mode === 'play' && S.run === 'daily'){
    const k = clamp(-S.pz / ROUTE_LEN, 0, 1);
    $('routeFill').style.width = (k * 100) + '%'; $('routeDot').style.left = (k * 100) + '%';
    if(-S.pz >= ROUTE_LEN) finishRoute();
  }
  if(S.mode === 'play') checkGoalsThrottle(dt);
  updateParts(dt); updateBursts(dt);

  ground.position.z = S.pz - 150; road.position.z = S.pz - 150;

  camTarget();
  const k = 1 - Math.exp(-real * (S.mode === 'play' ? 6 : 2.6));
  camPos.lerp(tPos, k); camLook.lerp(tLook, k);
  S.shake = Math.max(0, S.shake - real);
  const sh = S.shake * 1.1;
  camera.position.set(camPos.x + (rnd() - .5) * sh, camPos.y + (rnd() - .5) * sh * .6, camPos.z + S.pz);
  camera.lookAt(camLook.x + S.lean * 2, camLook.y, camLook.z + S.pz);
  S.fovKick += (0 - S.fovKick) * Math.min(1, real * 6);
  camera.fov = baseFov + (S.mode === 'play' ? (S.speed - 9) * .6 : 0) + S.fovKick;
  camera.updateProjectionMatrix();
  const n = isNight();
  const fogNear = S.mode === 'splash' ? 14 : (n ? 26 : 34), fogFar = S.mode === 'splash' ? 64 : (n ? 100 : 118);
  scene.fog.near += (fogNear - scene.fog.near) * k; scene.fog.far += (fogFar - scene.fog.far) * k;
  $('speedfx').style.opacity = S.mode === 'play' ? clamp((S.speed - 11) / 7, 0, .7) : 0;
  ensureChunks();
}
let goalTimer = 0;
function checkGoalsThrottle(dt){ goalTimer -= dt; if(goalTimer <= 0){ goalTimer = .5; checkGoals(); } }
let last = performance.now(), lastShown = -1;
function frame(now){
  const real = Math.min(.05, (now - last) / 1000); last = now;
  let dt = real;
  if(S.hitstop > 0){ S.hitstop -= real; dt = real * .06; }
  if(S.mode === 'over'){ S.slow = Math.max(.25, S.slow - real * 1.6); dt *= S.slow; }
  if(!S.paused) update(dt, real);
  S.shownScore += (S.score - S.shownScore) * Math.min(1, real * 12);
  if(Math.abs(S.score - S.shownScore) < .5) S.shownScore = S.score;
  const ds = Math.round(S.shownScore);
  if(ds !== lastShown){ if(ds > lastShown && lastShown >= 0 && S.mode === 'play'){ const e = $('score'); if(!e.classList.contains('bump')) bump(e); } $('score').textContent = ds; lastShown = ds; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
$('score').addEventListener('animationend', e => e.target.classList.remove('bump'));

/* ---------- UI rendering ---------- */
const CHECK_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3" stroke="#fff" stroke-width="2" fill="none"/></svg>';
function renderTasks(ul, live){
  ensureDay();
  ul.innerHTML = '';
  save.day.goals.forEach((g, i) => {
    const done = save.day.done[i];
    const li = document.createElement('li'); li.className = 'task' + (done ? ' done' : '');
    const p = done ? g.n : goalProgress(g, live);
    li.innerHTML = '<span class="box">' + CHECK_SVG + '</span><span class="txt">' + esc(T('goals.' + g.t, {n:g.n})) + '</span><span class="meta">' + (g.t === 'route' ? '' : p + '/' + g.n + ' · ') + '<b>₹' + g.r + '</b></span>';
    ul.appendChild(li);
  });
}
function renderWallet(){ document.querySelectorAll('.wallet').forEach(w => w.textContent = '₹' + save.tips); }
function renderMenu(){
  ensureDay();
  renderWallet();
  $('streakNum').textContent = displayStreak();
  $('streakLbl').textContent = T('streakLbl');
  $('dailyKicker').textContent = T('daily') + ' · ' + fmtDate(null, true);
  renderTasks($('tasks'), false);
  $('allDone').hidden = !save.day.done.every(Boolean);
  $('dailyBest').textContent = save.day.dailyBest || 0;
  $('playSub').textContent = T('playSub', {b: save.bests[prefs.city] || 0});
  document.querySelectorAll('.dl-city').forEach(e => e.textContent = T('cityEdition', {city: cityName(prefs.city)}));
}
function renderDates(){
  document.querySelectorAll('.dl-date').forEach(e => e.textContent = fmtDate());
  $('splashDate').textContent = fmtDate() + ' · ' + T('edition');
}
function updateNextTime(){
  const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
  let s = Math.max(0, Math.floor((mid - now) / 1000));
  const hh = String(Math.floor(s / 3600)).padStart(2, '0'), mm = String(Math.floor(s % 3600 / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  $('nextTime').textContent = hh + ':' + mm + ':' + ss;
  if(save.day && save.day.date !== dateKey() && !$('menu').hidden){ ensureDay(); Music.phrases = null; renderMenu(); checkReward(); }
}
setInterval(updateNextTime, 1000);

function buildLangSegs(){
  document.querySelectorAll('.langSeg').forEach(seg => {
    seg.innerHTML = '';
    Object.keys(LANG_NAMES).forEach(code => {
      const b = document.createElement('button'); b.type = 'button'; b.lang = code; b.textContent = LANG_NAMES[code];
      b.setAttribute('aria-pressed', String(prefs.lang === code));
      b.addEventListener('click', e => { e.stopPropagation(); setLang(code); sfx.click(); });
      seg.appendChild(b);
    });
  });
}
function buildCitySelect(){
  const sel = $('citySel'); sel.innerHTML = '';
  CITY_IDS.forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = cityName(id); sel.appendChild(o); });
  sel.value = prefs.city;
}
function syncSwitch(id, on){ const b = $(id); b.setAttribute('aria-pressed', String(!!on)); b.querySelector('.sv').textContent = on ? T('on') : T('off'); }
function renderSettings(){
  buildCitySelect();
  $('musicVol').value = prefs.music; $('musicVal').textContent = prefs.music;
  $('sfxVol').value = prefs.sfx; $('sfxVal').textContent = prefs.sfx;
  syncSwitch('swVibe', prefs.vibe); syncSwitch('swShake', prefs.shake); syncSwitch('swAssist', prefs.assist);
}
function applyI18n(){
  document.documentElement.lang = prefs.lang;
  document.documentElement.dataset.lang = prefs.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  $('splash').setAttribute('aria-label', T('tap'));
  renderDates(); renderMenu(); renderSettings(); renderShop(); buildLangSegs();
  if(!$('overScreen').hidden) fillOver(false);
}
function loadLangFonts(){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  const fam = prefs.lang === 'gu' ? ['800 40px "Mukta Vaani"', '40px Shrikhand', '40px Farsan'] : ['800 40px Mukta', '40px "Rozha One"', '700 40px Kalam'];
  return Promise.race([Promise.all(fam.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
}
function setLang(code){
  if(!LANG[code]) return;
  prefs.lang = code; TX = LANG[code]; savePrefs();
  applyI18n();
  loadLangFonts().then(() => {
    rebuildTextMats();
    if(S.mode === 'splash' || S.mode === 'menu'){ wr = Math.random; resetWorld(); }
  });
}

  {id:'bike_black', cat:'bike', key:'black', price:120},

const SWATCH = {

  theme: k => k === 'diwali' ? '<svg viewBox="0 0 40 30"><rect width="40" height="30" rx="4" fill="#2a2152"/><circle cx="31" cy="8" r="4" fill="#f3eac2"/><path d="M14 24 Q20 16 26 24 Z" fill="#b5542e"/><ellipse cx="20" cy="17" rx="2" ry="4" fill="#ffd166"/></svg>' : '<svg viewBox="0 0 40 30"><rect width="40" height="30" rx="4" fill="#f4b88c"/><circle cx="22" cy="18" r="7" fill="#ffd27f"/><rect y="22" width="40" height="8" fill="#5b5569"/></svg>'
};
let shopCat = 'bike';
function isOwned(it){ return !!save.owned[it.id]; }
function isEquipped(it){ return save.equip[it.cat] === it.key; }
function renderShop(){
  const tabs = $('shopTabs'); tabs.innerHTML = '';
  [['bike','catBike'],['hat','catHat'],['theme','catTheme']].forEach(([c, k]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = T(k); b.setAttribute('aria-pressed', String(shopCat === c));
    b.addEventListener('click', () => { shopCat = c; sfx.click(); renderShop(); });
    tabs.appendChild(b);
  });
  const grid = $('shopGrid'); grid.innerHTML = '';
  SHOP.filter(it => it.cat === shopCat).forEach(it => {
    const owned = isOwned(it), on = isEquipped(it);
    const card = document.createElement('div'); card.className = 'item' + (on ? ' on' : ''); card.dataset.id = it.id;
    let sub = '';
    if(!owned && it.streak) sub = '<span class="sub">' + esc(T('orStreak', {n:it.streak})) + '</span>';
    card.innerHTML = '<div class="item-top"><span class="sw">' + SWATCH[it.cat](it.key) + '</span><span class="nm">' + esc(T('items.' + it.id)) + sub + '</span></div>';
    const btn = document.createElement('button'); btn.type = 'button';
    if(on){ btn.className = 'btn ghost'; btn.textContent = T(it.cat === 'theme' ? 'inUse' : 'equipped'); btn.disabled = true; }
    else if(owned){ btn.className = 'btn'; btn.textContent = T(it.cat === 'theme' ? 'use' : 'equip'); btn.addEventListener('click', () => equipItem(it)); }
    else { btn.className = 'btn primary'; btn.textContent = T('buy', {p:it.price}); btn.addEventListener('click', () => buyItem(it, card)); }
    card.appendChild(btn); grid.appendChild(card);
  });
}
function equipItem(it){
  save.equip[it.cat] = it.key; persist(); sfx.click();
  if(it.cat === 'theme'){ applyTheme(); wr = Math.random; resetWorld(); } else applyCosmetics();
  if(it.cat === 'hat') S.squash = .25;
  renderShop();
}
function buyItem(it, card){
  if(save.tips < it.price){ $('shopNote').textContent = T('poor'); sfx.wrong(); card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); buzz(30); return; }
  save.tips -= it.price; save.owned[it.id] = 1; persist();
  sfx.buy(); buzz(20); $('shopNote').textContent = T('bought');
  coinBurst(card, document.querySelector('#shop .wallet'), 6);
  equipItem(it); renderWallet();
}
function coinBurst(fromEl, toEl, n){
  if(!fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  for(let i = 0; i < n; i++){
    const c = document.createElement('div'); c.className = 'coin'; c.textContent = '₹';
    const sx = a.left + a.width / 2 + (rnd() - .5) * 60, sy = a.top + a.height / 2 + (rnd() - .5) * 30;
    c.style.left = sx + 'px'; c.style.top = sy + 'px'; document.body.appendChild(c);
    const tx = b.left + b.width / 2 - sx, ty = b.top + b.height / 2 - sy;
    const anim = c.animate([
      {transform:'translate(0,0) scale(.4)', opacity:0},
      {transform:'translate(' + (rnd() - .5) * 80 + 'px,' + (-40 - rnd() * 50) + 'px) scale(1.1)', opacity:1, offset:.35},
      {transform:'translate(' + tx + 'px,' + ty + 'px) scale(.6)', opacity:1}
    ], {duration: 650 + i * 70, easing:'cubic-bezier(.5,0,.6,1)', fill:'forwards'});
    anim.onfinish = () => { c.remove(); sfx.coin(); bump(toEl); };
  }
}

/* daily reward */
let rewardInfo = null;
function checkReward(){
  rewardInfo = rewardState();
  if(rewardInfo.pending) setTimeout(openReward, 550);
}
function openReward(){
  if(!rewardInfo || !rewardInfo.pending || S.mode !== 'menu') return;
  const st = rewardInfo.streak, idx = (st - 1) % 7;
  $('rewardDay').textContent = T('day', {n: st});
  $('rewardAmt').textContent = '₹' + rewardInfo.amount;
  const days = $('rewardDays'); days.innerHTML = '';
  for(let i = 0; i < 7; i++){
    const d = document.createElement('div'); d.className = 'd' + (i < idx ? ' past' : i === idx ? ' today' : '');
    d.innerHTML = '<span>' + esc(T('dayShort')) + ' ' + (i + 1) + '</span><b>₹' + REWARDS[i] + '</b>';
    days.appendChild(d);
  }
  let note = rewardInfo.reset ? T('rewardReset') : T('rewardTomorrow');
  if(st >= 7 && !save.owned.theme_diwali) note = T('themeUnlocked') + ' ' + note;
  $('rewardNote').textContent = note;
  $('reward').hidden = false;
  const p = $('reward').querySelector('.page');
  Array.from(p.children).forEach((c, i) => c.style.setProperty('--i', i));
  p.classList.remove('enter','leave'); void p.offsetWidth; p.classList.add('enter');
  sfx.bell();
}
function claimReward(){
  if(!rewardInfo || !rewardInfo.pending) return;
  save.streak = rewardInfo.streak; save.lastClaim = dateKey(); save.tips += rewardInfo.amount;
  if(save.streak >= 7 && !save.owned.theme_diwali) save.owned.theme_diwali = 1;
  persist(); rewardInfo.pending = false;
  sfx.task(); buzz([20, 30, 20]);
  coinBurst($('rewardAmt'), document.querySelector('#menu .wallet'), 10);
  const p = $('reward').querySelector('.page'); p.classList.remove('enter'); p.classList.add('leave');
  setTimeout(() => { $('reward').hidden = true; renderMenu(); renderShop(); }, 380);
}

/* ---------- screens & transitions ---------- */
const SCREENS = ['splash','menu','howto','settings','shop','pauseScreen','overScreen'];
function show(id){
  SCREENS.forEach(s => { $(s).hidden = s !== id; });
  if(!id) return;
  const p = $(id).querySelector('.page');
  if(p){
    p.classList.remove('enter', 'leave');
    Array.from(p.children).forEach((c, i) => c.style.setProperty('--i', i));
    void p.offsetWidth; p.classList.add('enter');
    $(id).scrollTop = 0;
  }
  const f = $(id).querySelector('.btn.primary, .tap'); if(f) setTimeout(() => { try{ f.focus({preventScroll:true}); }catch(e){} }, 400);
}
let wiping = false;
function wipe(mid){
  if(wiping) return; wiping = true;
  const w = $('wipe'); w.hidden = false; w.className = 'in'; sfx.page();
  setTimeout(() => {
    mid();
    w.className = 'out';
    setTimeout(() => { w.hidden = true; w.className = ''; wiping = false; }, 440);
  }, 460);
}
function hudShow(on){
  const h = $('hud'), t = $('ticker');
  if(on){ h.hidden = false; t.hidden = false; requestAnimationFrame(() => { h.classList.remove('off'); t.classList.remove('off'); }); }
  else { h.classList.add('off'); t.classList.add('off'); }
  $('route').hidden = !(on && S.run === 'daily');
}

let wakeLock = null, zoneTimer = null, countTimers = [], settingsFrom = 'menu';
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
function enterMenu(){
  S.mode = 'menu'; ensureDay(); renderMenu(); show('menu'); setMusicMode('menu'); setDuck(1);
  checkReward();
}
function splashToMenu(){
  if(S.mode !== 'splash' || wiping) return;
  initAudio(); Music.start(); sfx.bell(); buzz(10);
  wipe(() => { enterMenu(); ensureChunks(); });
}
function startEndless(){
  if(S.mode !== 'menu') return;
  sfx.click(); S.run = 'endless';
  const p = $('menu').querySelector('.page'); p.classList.remove('enter'); p.classList.add('leave');
  setTimeout(() => { show(null); beginCountdown(false); }, 360);
}
function startDaily(){
  if(S.mode !== 'menu') return;
  sfx.click();
  wipe(() => { show(null); S.run = 'daily'; camPos.set(0, 6.6, 8.6); camLook.set(0, .6, -10); beginCountdown(true); });
}
function resetRun(){
  Object.assign(S, {paused:false, t:0, score:0, shownScore:0, papers:15, lives:3, combo:0, bestCombo:0, delivered:0, perfects:0, bundles:0, hops:0, earned:0, finished:false,
    jumpY:0, jumpV:0, inv:0, shake:0, wobble:0, squash:0, slow:1, hitstop:0});
  lastShown = -1; goalTimer = 0;
  buildLives(); hudPapers(); hudCombo();
  $('routeFill').style.width = '0%'; $('routeDot').style.left = '0%';
}
function beginCountdown(fresh){
  countTimers.forEach(clearTimeout); countTimers = [];
  S.mode = 'countdown'; resetRun();
  if(fresh){ wr = S.run === 'daily' ? mulberry32(hashStr('route' + dateKey())) : Math.random; resetWorld(); }
  hudShow(true); setMusicMode('game'); setDuck(1);
  $('tickerText').textContent = S.run === 'daily' ? T('tickerDaily') : T('tickerStart', {city: cityName(prefs.city)});
  $('shareBox').hidden = true; $('shareNote').textContent = '';
  const steps = TX.digits.concat([T('go')]);
  steps.forEach((s, i) => countTimers.push(setTimeout(() => {
    const c = $('count'); c.innerHTML = '';
    const sp = document.createElement('span'); sp.textContent = s; if(i === 3) sp.className = 'go';
    c.appendChild(sp);
    if(i < 3) sfx.tick(); else { sfx.bell(); startPlay(); }
  }, 300 + i * 650)));
  countTimers.push(setTimeout(() => { $('count').innerHTML = ''; }, 300 + 4 * 650));
}
function startPlay(){
  chunks.forEach(c => c.targets.forEach(tg => { if(!tg.done && tg.z > S.pz - 3) tg.missed = true; }));
  S.mode = 'play'; S.speed = 9; S.t = 0;
  const z = $('zones'); z.hidden = false; z.classList.remove('fade');
  clearTimeout(zoneTimer); zoneTimer = setTimeout(() => z.classList.add('fade'), 5500);
  keepAwake(true);
}
function countUp(el, to, prefix){
  const t0 = performance.now(), dur = 800;
  (function step(now){ const k = Math.min(1, (now - t0) / dur); el.textContent = (prefix || '') + Math.round(to * (1 - Math.pow(1 - k, 3))); if(k < 1) requestAnimationFrame(step); })(t0);
}
let lastOver = null;
function commitRun(){
  ensureDay();
  const d = save.day;
  d.total += S.delivered;
  const mx = d.max;
  mx.deliver = Math.max(mx.deliver || 0, S.delivered); mx.combo = Math.max(mx.combo || 0, S.bestCombo); mx.perfect = Math.max(mx.perfect || 0, S.perfects);
  mx.bundles = Math.max(mx.bundles || 0, S.bundles); mx.hops = Math.max(mx.hops || 0, S.hops); mx.score = Math.max(mx.score || 0, S.score);
  S.earned = S.delivered * 2 + S.perfects + (S.finished ? 50 : 0);
  save.tips += S.earned;
  let isNew = false, best;
  if(S.run === 'daily'){ isNew = S.score > (d.dailyBest || 0) && S.score > 0; if(isNew) d.dailyBest = S.score; best = d.dailyBest; }
  else { isNew = S.score > (save.bests[prefs.city] || 0) && S.score > 0; if(isNew) save.bests[prefs.city] = S.score; best = save.bests[prefs.city] || 0; }
  persist();
  checkGoalsAfter();
  lastOver = {isNew, best, score:S.score, delivered:S.delivered, combo:S.bestCombo, earned:S.earned, run:S.run, finished:S.finished};
}
function checkGoalsAfter(){
  save.day.goals.forEach((g, i) => {
    if(!save.day.done[i] && goalProgress(g, false) >= g.n){ save.day.done[i] = true; save.tips += g.r; }
  });
  if(save.day.done.every(Boolean) && !save.day.allBonus){ save.day.allBonus = true; save.tips += ALL_BONUS; }
  persist();
}
function fillOver(animate){
  const o = lastOver; if(!o) return;
  const daily = o.run === 'daily';
  $('overDate').textContent = (daily ? T('daily') : T('special')) + ' · ' + fmtDate(null, true);
  $('overCity').textContent = T('cityEdition', {city: cityName(prefs.city)});
  $('overStamp').hidden = !o.isNew;
  $('overKicker').textContent = o.finished ? T('kickerRoute') : (o.isNew ? T('kickerNew') : T('kickerDone'));
  $('overHead').textContent = o.finished ? T('overRoute', {n:o.delivered}) : (o.delivered > 0 ? T('overHead', {city: cityName(prefs.city), n:o.delivered}) : T('overNone'));
  renderTasks($('overTasks'), false);
  renderWallet();
  if(animate){
    ['stScore','stDel','stCombo','stBest'].forEach(id => $(id).textContent = 0); $('stEarn').textContent = '₹0';
    setTimeout(() => { countUp($('stScore'), o.score); countUp($('stDel'), o.delivered); countUp($('stCombo'), o.combo); countUp($('stBest'), o.best); countUp($('stEarn'), o.earned, '₹'); if(o.earned) sfx.coin(); if(o.isNew) sfx.combo(); }, 350);
  } else {
    $('stScore').textContent = o.score; $('stDel').textContent = o.delivered; $('stCombo').textContent = o.combo; $('stBest').textContent = o.best; $('stEarn').textContent = '₹' + o.earned;
  }
}
function showOver(){
  commitRun();
  hudShow(false); $('zones').hidden = true;
  show('overScreen'); fillOver(true);
  keepAwake(false);
}
function toMenu(){
  wipe(() => {
    countTimers.forEach(clearTimeout); $('count').innerHTML = '';
    hudShow(false); $('zones').hidden = true;
    S.mode = 'menu'; S.paused = false; S.run = 'endless'; wr = Math.random; resetWorld();
    camPos.set(4.0, 2.3, -1.2);
    enterMenu();
  });
  keepAwake(false);
}
function restart(){
  wipe(() => { S.paused = false; $('zones').hidden = true; show(null); camPos.set(0, 6.6, 8.6); beginCountdown(true); });
}
function setPaused(p){
  if(S.mode !== 'play' && S.mode !== 'countdown') return;
  if(p === S.paused) return;
  S.paused = p;
  if(p){
    countTimers.forEach(clearTimeout); countTimers = []; $('count').innerHTML = '';
    $('psScore').textContent = S.score; $('psPapers').textContent = S.papers; $('psDel').textContent = S.delivered;
    show('pauseScreen'); sfx.click(); setDuck(.35);
  } else {
    const pg = $('pauseScreen').querySelector('.page'); pg.classList.remove('enter'); pg.classList.add('leave');
    setTimeout(() => { show(null); last = performance.now(); if(S.mode === 'countdown') beginCountdown(false); }, 300);
    sfx.click(); setDuck(1);
  }
}
function openSettings(from){
  settingsFrom = from; sfx.click(); renderSettings(); $('setNote').textContent = ''; $('resetConfirm').hidden = true;
  if(from === 'pause') show('settings'); else wipe(() => show('settings'));
}
function closeSettings(){
  sfx.click();
  if(settingsFrom === 'pause') show('pauseScreen');

}

$('claimBtn').addEventListener('click', claimReward);
$('citySel').addEventListener('change', e => { prefs.city = e.target.value; savePrefs(); renderMenu(); sfx.click(); });
$('musicVol').addEventListener('input', e => { prefs.music = +e.target.value; $('musicVal').textContent = prefs.music; savePrefs(); initAudio(); applyVolumes(); if(!Music.on) Music.start(); });
$('sfxVol').addEventListener('input', e => { prefs.sfx = +e.target.value; $('sfxVal').textContent = prefs.sfx; savePrefs(); initAudio(); applyVolumes(); });
$('sfxVol').addEventListener('change', () => sfx.hit(0));
[['swVibe','vibe'],['swShake','shake'],['swAssist','assist']].forEach(([id, key]) => $(id).addEventListener('click', () => { prefs[key] = !prefs[key]; savePrefs(); syncSwitch(id, prefs[key]); sfx.click(); if(key === 'vibe') buzz(30); }));
$('resetBtn').addEventListener('click', () => { $('resetConfirm').hidden = false; sfx.click(); });
$('resetNo').addEventListener('click', () => { $('resetConfirm').hidden = true; sfx.click(); });
$('resetYes').addEventListener('click', () => {
  save = SAVE_DEFAULT(); persist(); ensureDay(); applyCosmetics(); applyTheme();
  $('resetConfirm').hidden = true; $('setNote').textContent = T('resetDone'); sfx.wrong();
  renderMenu(); renderShop();
});
function silence(){ setPaused(true); if(ac && ac.state === 'running') ac.suspend(); }
function wake(e){ if(!ac && e && e.type === 'pointerdown' && S.mode !== 'splash'){ initAudio(); Music.start(); return; } if(ac && Music.on && !document.hidden && document.hasFocus()){ ac.resume(); Music.next = ac.currentTime + .05; } }
document.addEventListener('visibilitychange', () => { if(document.hidden) silence(); else wake(); });
window.addEventListener('blur', silence);
window.addEventListener('pagehide', () => { silence(); try{ clearInterval(Music.timer); Music.on = false; if(ac) ac.close(); }catch(e){} ac = null; });
window.addEventListener('focus', wake);
document.addEventListener('pointerdown', wake, true);
$('shareBtn').addEventListener('click', () => {
  sfx.click();
  const o = lastOver || {score:0, delivered:0};
  const text = o.run === 'daily'
    ? T('shareDaily', {date: fmtDate(null, true), s:o.score, n:o.delivered, streak: Math.max(1, displayStreak())})
    : T('shareEndless', {city: cityName(prefs.city), n:o.delivered, s:o.score});
  const box = $('shareBox'); box.value = text;
  const fallback = () => { box.hidden = false; box.focus(); box.select(); $('shareNote').textContent = T('selected'); };
  try{ navigator.clipboard.writeText(text).then(() => { $('shareNote').textContent = T('copied'); }, fallback); }
  catch(e){ fallback(); }
});
canvas.addEventListener('pointerdown', e => {
  if(S.mode !== 'play' || S.paused) return;
  e.preventDefault();
  const r = e.clientX / window.innerWidth;
  if(r < .34) throwPaper(-1); else if(r > .66) throwPaper(1); else jump();
});
window.addEventListener('keydown', e => {
  const k = e.key;
  if(S.mode === 'splash' && (k === 'Enter' || k === ' ')){ e.preventDefault(); splashToMenu(); return; }
  if(S.mode !== 'play' && S.mode !== 'countdown') return;
  if(k === 'Escape' || k === 'p' || k === 'P'){ if(!$('settings').hidden) return; setPaused(!S.paused); return; }
  if(S.paused || S.mode !== 'play') return;
  if(k === 'ArrowLeft' || k === 'a' || k === 'A'){ throwPaper(-1); e.preventDefault(); }
  else if(k === 'ArrowRight' || k === 'd' || k === 'D'){ throwPaper(1); e.preventDefault(); }
  else if(k === 'ArrowUp' || k === ' ' || k === 'w' || k === 'W'){ jump(); e.preventDefault(); }
});

/* ---------- boot ---------- */
function boot(){
  TX = LANG[prefs.lang];
  ensureDay(); applyTheme(); applyCosmetics(); applyI18n();
  loadLangFonts().then(() => {
    rebuildTextMats();
    resetWorld();
    requestAnimationFrame(t => { last = t; frame(t); });
  });
}
try{
  const hot = window.claude && window.claude.hot;
  if(hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({lang: prefs.lang}));
  if(hot && typeof hot.ready === 'function') hot.ready(() => boot()); else boot();
}catch(e){ boot(); }
})();
</script>
